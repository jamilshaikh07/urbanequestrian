server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers (site uses Google Fonts, inline style attributes, same-origin script)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;

    # Never serve dotfiles or build files, whatever ends up in the web root
    location ~ /\. { return 404; }
    location = /Dockerfile { return 404; }

    location / {
        try_files $uri $uri/ =404;
    }

    # Static assets: long cache (files are versioned with ?v=)
    location ~* \.(css|js|png|jpg|jpeg|webp|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=86400" always;
        add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
}
